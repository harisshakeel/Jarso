name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Placeholders so env validation passes at build time. Real values come from the deploy platform.
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder

jobs:
  # What a pull request touched, so jobs a change cannot affect are skipped: docs, session logs
  # and Claude config run nothing but the secrets scan; the database jobs run only for schema
  # changes. A push to main runs everything.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
      db: ${{ steps.filter.outputs.db }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        run: |
          code=false; db=false
          if [ "${{ github.event_name }}" = "push" ]; then
            code=true; db=true
          else
            git fetch -q origin "${{ github.base_ref }}"
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              case "$f" in
                docs/*|.claude-logs/*|.claude/*|*.md|LICENSE) ;;
                *) code=true ;;
              esac
              case "$f" in supabase/*|packages/db/*) db=true ;; esac
            done <<< "$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD)"
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "db=$db" >> "$GITHUB_OUTPUT"
          echo "code changed: $code · schema changed: $db" >> "$GITHUB_STEP_SUMMARY"

  verify:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Turbo's task cache and Next's build cache from the last run on this branch (or main), so
      # unchanged packages replay and the app build is incremental.
      - uses: actions/cache@v6
        with:
          path: |
            .turbo
            apps/web/.next/cache
          key: verify-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            verify-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - name: Lint commit messages
        if: github.event_name == 'pull_request'
        run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
      - run: pnpm lint
      - name: Typecheck, test, build (affected only on PRs)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pnpm turbo typecheck test build --affected
          else
            pnpm turbo typecheck test build
          fi

  e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # Starts alongside verify (a failed verify still fails the run). A pull request runs one job
    # with only the projects its changes touch (see "Pick the projects"); a push to main runs
    # the whole suite in two shards. Each job builds the app and starts its own local Supabase.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ github.event_name == 'push' && fromJSON('[1, 2]') || fromJSON('[1]') }}
    steps:
      # Local Supabase publishes host ports 54320-54329, inside Linux's ephemeral range
      # (32768-60999). An outbound connection (image pulls, installs) can take one as its source
      # port, and `supabase start` then fails with "address already in use". Reserving the range
      # stops the kernel handing those ports out.
      - name: Reserve the local Supabase ports
        run: sudo sysctl -w net.ipv4.ip_local_reserved_ports=54320-54329
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # A pull request runs only the projects its changes touch (scripts/e2e-projects.sh); a
      # change shared by every page, and every push to main, runs the whole suite.
      - name: Pick the projects
        id: pick
        if: github.event_name == 'pull_request'
        run: |
          git fetch -q origin "${{ github.base_ref }}"
          args=$(bash scripts/e2e-projects.sh "origin/${{ github.base_ref }}")
          echo "args=$args" >> "$GITHUB_OUTPUT"
          echo "e2e projects: ${args:-all}" >> "$GITHUB_STEP_SUMMARY"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache the Playwright browser
        id: browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - if: steps.browser.outputs.cache-hit != 'true'
        run: pnpm --filter @jarso/web exec playwright install --with-deps chromium
      - if: steps.browser.outputs.cache-hit == 'true'
        run: pnpm --filter @jarso/web exec playwright install-deps chromium
      # Next's build cache from the last run, so the app build Playwright starts is incremental.
      - uses: actions/cache@v6
        with:
          path: apps/web/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - uses: supabase/setup-cli@v3
        with:
          version: 2.122.0 # keep in sync with the `supabase` devDependency
      # Only the services the app uses: database, gateway, auth, REST, Realtime and the mail
      # catcher. Studio, analytics, the edge runtime, image proxy, storage and the meta API are
      # left out, which is most of the boot time. stdout carries the local keys, so it is
      # discarded; the Playwright config reads the keys itself via `supabase status -o json`.
      - name: Start local Supabase
        run: supabase start -x studio,logflare,vector,imgproxy,postgres-meta,edge-runtime,storage-api > /dev/null
      - run: pnpm --filter @jarso/web exec playwright test --shard=${{ matrix.shard }}/${{ strategy.job-total }} --pass-with-no-tests ${{ steps.pick.outputs.args }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: apps/web/playwright-report
          retention-days: 7

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan for committed credentials
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  migrations:
    needs: changes
    if: needs.changes.outputs.db == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Same port reservation as the e2e job.
      - name: Reserve the local Supabase ports
        run: sudo sysctl -w net.ipv4.ip_local_reserved_ports=54320-54329
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: 2.122.0 # keep in sync with the `supabase` devDependency
      - name: Apply migrations to a fresh local database
        run: |
          supabase db start
          supabase db reset --local
      - name: Run database tests (pgTAP)
        run: supabase test db --local
      - name: Lint database schema
        run: supabase db lint --local --fail-on error
