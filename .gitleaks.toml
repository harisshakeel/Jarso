# Gitleaks config. Runs in CI (secrets job) over every push and PR. Keep in sync with
# scripts/check-secrets.sh and the REDACTIONS list in .claude/hooks/extract-log.py.
title = "Jarso"

[extend]
useDefault = true

[[rules]]
id = "supabase-api-key"
description = "Supabase secret or publishable API key"
regex = '''sb_(secret|publishable)_[A-Za-z0-9_-]{4,}'''
keywords = ["sb_secret_", "sb_publishable_"]

[[rules]]
id = "supabase-access-token"
description = "Supabase personal access token"
regex = '''sbp_[A-Za-z0-9]{20,}'''
keywords = ["sbp_"]

[[rules]]
id = "anthropic-api-key"
description = "Anthropic API key"
regex = '''sk-ant-[A-Za-z0-9_-]{12,}'''
keywords = ["sk-ant-"]

[[rules]]
id = "resend-api-key"
description = "Resend API key (invitation email)"
regex = '''\bre_[A-Za-z0-9_]{20,}'''
keywords = ["re_"]

[[rules]]
id = "vapid-private-key"
description = "Web push VAPID private key (no prefix: matched by its variable name)"
regex = '''(?i)private[ _-]?key[A-Z0-9_]*["']?\s*[:=]\s*["']?[A-Za-z0-9_-]{40,}|(?i)private key:\s*\r?\n\s*[A-Za-z0-9_-]{40,}'''
keywords = ["private_key", "privatekey", "private key", "VAPID_PRIVATE_KEY"]

[[allowlists]]
description = "Placeholders, fixtures and lockfile hashes"
paths = ['''\.env\.example$''', '''pnpm-lock\.yaml$''']
regexes = [
  '''sb_(secret|publishable)_(\.\.\.|…|\[REDACTED\])''',
  '''\[(JWT |PRIVATE KEY )?REDACTED\]''',
  '''[?&]key=\[REDACTED\]''',
  '''ci-placeholder''',
  '''test-publishable-key''',
  '''db password leaked in message''',
]
