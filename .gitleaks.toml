# Gitleaks config. Runs in CI (secrets job) over every push and PR. Keep in sync with
# scripts/check-secrets.sh and the REDACTIONS list in .claude/hooks/extract-log.py.
title = "Jarso"

[extend]
useDefault = true

[[rules]]
id = "supabase-api-key"
description = "Supabase secret or publishable API key"
regex = '''sb_(secret|publishable)_[A-Za-z0-9_-]{4,}'''
keywords = ["sb_secret_", "sb_publishable_"]

[[rules]]
id = "supabase-access-token"
description = "Supabase personal access token"
regex = '''sbp_[A-Za-z0-9]{20,}'''
keywords = ["sbp_"]

[[rules]]
id = "anthropic-api-key"
description = "Anthropic API key"
regex = '''sk-ant-[A-Za-z0-9_-]{12,}'''
keywords = ["sk-ant-"]

# Rules use non-capturing groups: gitleaks takes the first capture group as the secret, so a
# group would hide the key from the allowlist below.
[[rules]]
id = "stripe-api-key"
description = "Stripe secret or restricted API key"
regex = '''\b(?:sk|rk)_(?:test|live)_[A-Za-z0-9]{16,}'''
keywords = ["sk_test_", "sk_live_", "rk_test_", "rk_live_"]

[[rules]]
id = "stripe-webhook-secret"
description = "Stripe webhook signing secret"
regex = '''\bwhsec_[A-Za-z0-9]{16,}'''
keywords = ["whsec_"]

[[rules]]
id = "stripe-client-secret"
description = "Stripe PaymentIntent or SetupIntent client secret (the phone's card sheet)"
regex = '''\b(?:pi|seti)_[A-Za-z0-9]+_secret_[A-Za-z0-9]{8,}'''
keywords = ["_secret_"]

[[rules]]
id = "stripe-ephemeral-key"
description = "Stripe ephemeral key (the phone's card sheet)"
regex = '''\bek_(?:test|live)_[A-Za-z0-9_-]{16,}'''
keywords = ["ek_test_", "ek_live_"]

[[rules]]
id = "razorpay-key-id"
description = "Razorpay API key id (test or live)"
regex = '''\brzp_(?:test|live)_[A-Za-z0-9]{14,}'''
keywords = ["rzp_test_", "rzp_live_"]

[[rules]]
id = "resend-api-key"
description = "Resend API key (invitation email)"
regex = '''\bre_[A-Za-z0-9_]{20,}'''
keywords = ["re_"]

[[rules]]
id = "vapid-private-key"
description = "Web push VAPID private key (no prefix: matched by its variable name)"
regex = '''(?i)private[ _-]?key[A-Z0-9_]*["']?\s*[:=]\s*["']?[A-Za-z0-9_-]{40,}|(?i)private key:\s*\r?\n\s*[A-Za-z0-9_-]{40,}'''
keywords = ["private_key", "privatekey", "private key", "VAPID_PRIVATE_KEY"]

# gitleaks 8.24 (what gitleaks-action@v3 installs) only reads the singular [allowlist] table.
[allowlist]
description = "Placeholders, fixtures and lockfile hashes"
paths = ['''\.env\.example$''', '''pnpm-lock\.yaml$''']
regexes = [
  '''sb_(secret|publishable)_(\.\.\.|…|\[REDACTED\])''',
  '''\[(JWT |PRIVATE KEY )?REDACTED\]''',
  '''[?&]key=\[REDACTED\]''',
  '''ci-placeholder''',
  '''test-publishable-key''',
  '''rzp_(test|live)_X{14,}''',
  '''test-cron-secret-0123456789''',
  '''db password leaked in message''',
]
