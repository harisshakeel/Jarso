# Notifications: the inbox, mark all as read, open a notice.
appId: app.jarso.mobile
---
- runFlow: sign-in.yaml
- tapOn: "Notifications"
- assertVisible: "Notifications"
- runFlow:
    when:
      visible: "Mark all as read"
    commands:
      - tapOn: "Mark all as read"
- runFlow:
    when:
      visible:
        id: "notice-row"
    commands:
      - tapOn:
          id: "notice-row"
          index: 0
