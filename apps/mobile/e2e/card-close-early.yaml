# Close the card sheet before paying: the payment stays in progress (never paid), then Cancel
# card payment ends it. Runs with the fake provider (PAYMENTS_ALLOW_FAKE=true, no provider keys);
# with Stripe keys, close Stripe's sheet with Back instead of Go back.
#   maestro test -e PARENT_EMAIL=... -e PARENT_PASSWORD=... e2e/card-close-early.yaml
appId: app.jarso.mobile
---
- runFlow: parent-sign-in.yaml
- scrollUntilVisible:
    element:
      text: "Hand over allowance to .*"
    direction: DOWN
    timeout: 20000
- tapOn:
    text: "Hand over allowance to .*"
    index: 0
- scrollUntilVisible:
    element:
      text: "Or pay by card"
    direction: DOWN
    timeout: 20000
- tapOn: "Pay by card"
- extendedWaitUntil:
    visible: "Test card \\(dev build\\)"
    timeout: 15000
- tapOn: "Go back"
- extendedWaitUntil:
    visible: "Card payment in progress"
    timeout: 15000
- assertVisible: "Pay again"
- assertNotVisible: "Payment received."
- tapOn: "Cancel card payment"
# The toast says "Card payment cancelled." and the card buttons come back.
- extendedWaitUntil:
    visible: "Or pay by card"
    timeout: 15000
- assertNotVisible: "Card payment in progress"
