# Signs the test child in (or does nothing if a session is already saved), then lands on Home.
# Credentials come from the developer's shell, never the repo:
#   maestro test -e CHILD_FAMILY_CODE=... -e CHILD_NICKNAME=... -e CHILD_PIN=... e2e
appId: app.jarso.mobile
---
- launchApp
- extendedWaitUntil:
    visible: "Family code|I'm a child|Your family|Spent something\\?"
    timeout: 20000
# A parent session left by a parent flow: clear the app so the sign-in screen shows.
- runFlow:
    when:
      visible: "Your family"
    commands:
      - launchApp:
          clearState: true
      - extendedWaitUntil:
          visible: "I'm a child"
          timeout: 20000
# The sign-in screen keeps the last choice: pick the child form if the parent one shows.
- runFlow:
    when:
      visible: "Email"
    commands:
      - tapOn: "I'm a child"
- runFlow:
    when:
      visible: "Family code"
    commands:
      - tapOn: "Family code"
      - inputText: ${CHILD_FAMILY_CODE}
      - tapOn: "Your nickname"
      - inputText: ${CHILD_NICKNAME}
      - tapOn: "Your PIN"
      - inputText: ${CHILD_PIN}
      - hideKeyboard
      - tapOn: "Sign in"
- extendedWaitUntil:
    visible: "Spent something?"
    timeout: 20000
- assertVisible: "Put some in Save"
