# Signs the test child in (or does nothing if a session is already saved), then lands on Home.
# Credentials come from the developer's shell, never the repo:
#   maestro test -e CHILD_FAMILY_CODE=... -e CHILD_NICKNAME=... -e CHILD_PIN=... e2e
appId: app.jarso.mobile
---
- launchApp
- extendedWaitUntil:
    visible: "Family code|I'm a child|I'm a kid|Your family|What happened\\?"
    timeout: 20000
# A parent session left by a parent flow: clear the app so the sign-in screen shows.
- runFlow:
    when:
      visible: "Your family"
    commands:
      - launchApp:
          clearState: true
      - extendedWaitUntil:
          visible: "I'm a child|I'm a kid"
          timeout: 20000
# A phone nobody has signed in on opens Welcome first.
- runFlow:
    when:
      visible: "I'm a kid"
    commands:
      - tapOn: "I'm a kid"
# The sign-in screen keeps the last choice: pick the child form if the parent one shows.
- runFlow:
    when:
      visible: "Email"
    commands:
      - tapOn: "I'm a child"
- runFlow:
    when:
      visible: "Family code"
    commands:
      - tapOn: "Family code"
      - inputText: ${CHILD_FAMILY_CODE}
      - tapOn: "Your nickname"
      - inputText: ${CHILD_NICKNAME}
      - hideKeyboard
      # The PIN is typed on the pad (keys pin-key-0 … pin-key-9), 4 to 6 numbers.
      - evalScript: ${output.pin = String(CHILD_PIN).split('')}
      - tapOn:
          id: "pin-key-${output.pin[0]}"
      - tapOn:
          id: "pin-key-${output.pin[1]}"
      - tapOn:
          id: "pin-key-${output.pin[2]}"
      - tapOn:
          id: "pin-key-${output.pin[3]}"
      - runFlow:
          when:
            true: ${output.pin.length > 4}
          commands:
            - tapOn:
                id: "pin-key-${output.pin[4]}"
      - runFlow:
          when:
            true: ${output.pin.length > 5}
          commands:
            - tapOn:
                id: "pin-key-${output.pin[5]}"
      - scrollUntilVisible:
          element:
            text: "Sign in"
          direction: DOWN
      - tapOn: "Sign in"
# A test child who never finished the intro sees it first: skip it (replayable from Me).
- extendedWaitUntil:
    visible: "What happened\\?|Skip"
    timeout: 20000
- runFlow:
    when:
      visible: "Skip"
    commands:
      - tapOn: "Skip"
# Home: the + button ("What happened?") sits on every child tab, with the Spend and Save tiles.
- extendedWaitUntil:
    visible: "What happened?"
    timeout: 20000
- assertVisible: "Spend"
