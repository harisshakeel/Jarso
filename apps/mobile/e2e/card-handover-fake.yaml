# Hand over a due allowance by card with the fake provider's test card (dev builds only), then
# see "Paid by card" in the child's Diary. No provider keys: run `pnpm dev` with
# PAYMENTS_ALLOW_FAKE=true and no STRIPE_* / RAZORPAY_* keys, so the only row is
# "Test card" (read as "Pay with Test card"). Needs an allowance due for the test child.
#   maestro test -e PARENT_EMAIL=... -e PARENT_PASSWORD=... -e CHILD_FAMILY_CODE=...
#     -e CHILD_NICKNAME=... -e CHILD_PIN=... e2e/card-handover-fake.yaml
appId: app.jarso.mobile
---
- runFlow: parent-sign-in.yaml
- scrollUntilVisible:
    element:
      text: "Hand over allowance to .*"
    direction: DOWN
    timeout: 20000
- tapOn:
    text: "Hand over allowance to .*"
    index: 0
- scrollUntilVisible:
    element:
      text: "Or pay by card"
    direction: DOWN
    timeout: 20000
- tapOn: "Pay with Test card"
# The dev build's test-card dialog stands in for the provider's sheet.
- extendedWaitUntil:
    visible: "Test card \\(dev build\\)"
    timeout: 15000
- tapOn: "Pay"
# Only the server says it's paid. Once the jars update the item is no longer due and the
# sheet closes back to Family.
- extendedWaitUntil:
    visible: "Payment received\\.|Your family"
    timeout: 30000
- extendedWaitUntil:
    visible: "Your family"
    timeout: 30000
# The child sees it as a card handover.
- runFlow: sign-in.yaml
- tapOn: "Diary"
- extendedWaitUntil:
    visible: ".*Paid by card.*"
    timeout: 20000
