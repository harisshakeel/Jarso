# Signs the test parent in (or does nothing if a parent session is already saved), then lands on
# Family. A sub-flow: the other parent flows start with it. The test parent has finished setup
# (profile and family), so the setup gate lets them through.
# Credentials come from the developer's shell, never the repo:
#   maestro test -e PARENT_EMAIL=... -e PARENT_PASSWORD=... e2e/parent-sign-in.yaml
appId: app.jarso.mobile
---
- launchApp
- extendedWaitUntil:
    visible: "I'm a parent|I'm a kid|Your family|What happened\\?"
    timeout: 20000
# A child session left by a child flow: clear the app so the sign-in screen shows.
- runFlow:
    when:
      visible: "What happened?"
    commands:
      - launchApp:
          clearState: true
      - extendedWaitUntil:
          visible: "I'm a parent"
          timeout: 20000
# A phone nobody has signed in on opens Welcome first.
- runFlow:
    when:
      visible: "I'm a kid"
    commands:
      - tapOn: "I have an account. Sign in"
# The sign-in screen keeps the last choice: pick the parent form if the child one shows.
- runFlow:
    when:
      visible: "Family code"
    commands:
      - tapOn: "I'm a parent"
- runFlow:
    when:
      visible: "Email"
    commands:
      - tapOn: "Email"
      - inputText: ${PARENT_EMAIL}
      - tapOn: "Password"
      - inputText: ${PARENT_PASSWORD}
      - hideKeyboard
      - tapOn: "Sign in"
- extendedWaitUntil:
    visible: "Your family"
    timeout: 20000
- assertVisible: "Family"
